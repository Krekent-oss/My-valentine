
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Will You Be My Valentine?</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      font-family: 'Segoe UI', sans-serif;
      text-align: center;
    }

    .card {
      background: white;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      max-width: 350px;
      width: 90%;
    }

    h1 {
      color: #e63946;
    }

    p {
      font-size: 18px;
      margin-bottom: 25px;
    }

    button {
      padding: 12px 22px;
      font-size: 16px;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      margin: 8px;
      transition: 0.3s;
    }

    #yes {
      background: #e63946;
      color: white;
    }

    #yes:hover {
      background: #d62839;
    }

    #no {
      background: #adb5bd;
      color: black;
      position: relative;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Hey My Love ❤️</h1>
    <p>Will you be my Valentine?</p>
    <button id="yes" onclick="sayYes()">Yes 💕</button>
    <button id="no" onmouseover="moveNo()">No 🙈</button>
  </div>

  <script>
    function sayYes() {
      document.body.innerHTML = `
        <div style="
          height:100vh;
          display:flex;
          align-items:center;
          justify-content:center;
          flex-direction:column;
          background: linear-gradient(135deg, #ff758c, #ff7eb3);
          color:white;
          text-align:center;
          font-family: 'Segoe UI', sans-serif;">
          <h1>Yaaay!! 💖🥰</h1>
          <p style="font-size:20px;">
            You just made me the happiest person alive 💘<br>
            Happy Valentine’s, my love 🌹
          </p>
        </div>
      `;
    }

    function moveNo() {
      const noBtn = document.getElementById("no");
      const x = Math.random() * 200 - 100;
      const y = Math.random() * 200 - 100;
      noBtn.style.transform = `translate(${x}px, ${y}px)`;
    }
  </script>

</body>
</html>
