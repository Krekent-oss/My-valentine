<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Valentine 💖</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      font-family: 'Segoe UI', sans-serif;
      text-align: center;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      max-width: 350px;
      width: 90%;
    }

    img {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 15px;
      border: 3px solid #e63946;
    }

    h1 {
      color: #e63946;
    }

    button {
      padding: 12px 20px;
      border: none;
      border-radius: 25px;
      font-size: 16px;
      cursor: pointer;
      background: #e63946;
      color: white;
    }
  </style>
</head>
<body>

  <div class="card">
    <img src="me.jpg" alt="Me">
    <h1>Hey My Love ❤️</h1>
    <p>There’s something special I want to ask you…</p>
    <button onclick="playSong()">Tap here 💕</button>
  </div>

  <audio id="song">
    <source src="song.mp3" type="audio/mpeg">
  </audio>

  <script>
    function playSong() {
      document.getElementById("song").play();
      document.body.innerHTML = `
        <div style="
          height:100vh;
          display:flex;
          align-items:center;
          justify-content:center;
          flex-direction:column;
          background: linear-gradient(135deg, #ff758c, #ff7eb3);
          color:white;
          text-align:center;
          font-family: 'Segoe UI', sans-serif;">
          <h1>Will you be my Valentine? 💖</h1>
          <p>You mean more to me than words can explain 
          I love you to the moon and back 🌹</p>
        </div>
      `;
    }
  </script>

</body>
</html>
